appId: ru.ttsapp.desktop
productName: TwitchTTS
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-win-x64.${ext}
electronLanguages:
  - ru
  - en-US
